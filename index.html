<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoApp - Notizie del giorno</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-top">
    <h1>📰 InfoApp</h1>
    <button id="refresh-btn" class="refresh-btn">🔄 Aggiorna</button>
  </div>
  <p id="last-update">Caricamento...</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="finanza">📈 Finanza</button>
  <button class="tab-btn" data-tab="attualita">🗞️ Attualità</button>
  <button class="tab-btn" data-tab="sport">⚽ Sport</button>
  <button class="tab-btn" data-tab="meteo">🌦️ Meteo</button>
  <button class="tab-btn" data-tab="cinema">🎬 Cinema Lissone</button>
</nav>

<div class="content-wrapper">
  <aside id="history-sidebar" class="history-sidebar">
    <h3>📅 Storico</h3>
    <ul id="history-list"></ul>
  </aside>

  <main>
    <section id="finanza" class="tab-content active">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" data-region="italia">🇮🇹 Italia</button>
        <button class="sub-tab-btn" data-region="europa">🇪🇺 Europa</button>
        <button class="sub-tab-btn" data-region="usa">🇺🇸 USA</button>
        <button class="sub-tab-btn" data-region="mondo">🌍 Resto del mondo</button>
      </div>
      <div id="finanza-italia-list" class="news-grid region-panel active"></div>
      <div id="finanza-europa-list" class="news-grid region-panel"></div>
      <div id="finanza-usa-list" class="news-grid region-panel"></div>
      <div id="finanza-mondo-list" class="news-grid region-panel"></div>
    </section>

    <section id="attualita" class="tab-content">
      <div id="attualita-list" class="news-grid"></div>
    </section>

    <section id="sport" class="tab-content">
      <div id="sport-list" class="news-grid"></div>
    </section>

    <section id="meteo" class="tab-content">
      <div class="weather-search">
        <input type="text" id="weather-search-input" placeholder="Cerca una città (es. Lissone, Milano...)">
        <button id="weather-search-btn">🔍 Cerca</button>
      </div>
      <div id="weather-results" class="weather-results"></div>
      <div id="weather-location-name" class="weather-location-name"></div>
      <div id="weather-forecast" class="weather-forecast-grid"></div>
    </section>

    <section id="cinema" class="tab-content">
      <div id="cinema-list" class="news-grid"></div>
    </section>
  </main>
</div>

<footer>
  <p>Estratti e link alle fonti originali. Meteo fornito da Open-Meteo.com. Tutti i diritti appartengono ai rispettivi editori.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
