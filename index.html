<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoApp - Notizie del giorno</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>📰 InfoApp</h1>
  <p id="last-update">Caricamento...</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="finanza">📈 Finanza</button>
  <button class="tab-btn" data-tab="attualita">🗞️ Attualità</button>
  <button class="tab-btn" data-tab="sport">⚽ Sport</button>
  <button class="tab-btn" data-tab="cinema">🎬 Cinema Lissone</button>
</nav>

<main>
  <section id="finanza" class="tab-content active">
    <div id="finanza-list" class="news-grid"></div>
  </section>
  <section id="attualita" class="tab-content">
    <div id="attualita-list" class="news-grid"></div>
  </section>
  <section id="sport" class="tab-content">
    <div id="sport-list" class="news-grid"></div>
  </section>
  <section id="cinema" class="tab-content">
    <div id="cinema-list" class="news-grid"></div>
  </section>
</main>

<footer>
  <p>Estratti e link alle fonti originali. Tutti i diritti appartengono ai rispettivi editori.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
